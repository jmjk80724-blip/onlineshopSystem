name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: testpassword
            POSTGRES_DB:  online_shop_db_test
        ports:
            - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up JDK 17
          uses: actions/setup-java@v4
          with:
            java-version: '17'
            distribution: 'temurin'
            cache: maven

        - name: Build Application
          run: ./mvnw clean package -DskipTests
          env:
            SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/online_shop_db_test
            SPRING_DATASOURCE_USERNAME: postgres
            SPRING_DATASOURCE_PASSWORD: testpassword
            JWT_SECRET: ci-test-secret-key-must-be-at-least-32-bytes
            JWT_EXPIRATION: 3600000

        - name: Build Application
          run: ./mvnw clean package -DskipTests


